<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020618"/>
      <stop offset="100%" stop-color="#0a0e1f"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Outer orbital ring -->
  <ellipse cx="50" cy="50" rx="34" ry="20" fill="none" stroke="url(#ring1)" stroke-width="3" transform="rotate(-25,50,50)" opacity="0.6" filter="url(#glow)"/>
  <!-- Inner orbital ring -->
  <ellipse cx="50" cy="50" rx="28" ry="16" fill="none" stroke="url(#ring2)" stroke-width="3.5" transform="rotate(35,50,50)" opacity="0.8" filter="url(#glow)"/>
  <!-- 4-point star center -->
  <path d="M50 24 L54 43 L73 50 L54 57 L50 76 L46 57 L27 50 L46 43 Z" fill="url(#star)" filter="url(#glow)"/>
  <!-- Accent glow dot -->
  <circle cx="73" cy="34" r="3.5" fill="#38bdf8" opacity="0.9" filter="url(#glow)"/>
  <circle cx="28" cy="64" r="2" fill="#2563eb" opacity="0.6"/>
</svg>